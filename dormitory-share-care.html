<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Dormitory Share & Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #FFD9E7;
    --pink-deep: #FF9FC4;
    --pink-text: #C2447A;
    --blue: #D6ECFF;
    --blue-deep: #8FC7FF;
    --blue-text: #2E7BC4;
    --white: #FFFFFF;
    --ink: #3A3247;
    --ink-soft: #8A8296;
    --green: #56C596;
    --green-bg: #E3F8EF;
    --red: #FF7A8A;
    --red-bg: #FFE9EC;
    --yellow: #FFC15E;
    --yellow-bg: #FFF4E0;
    --radius: 22px;
    --radius-sm: 14px;
    --shadow: 0 10px 30px -12px rgba(194,68,122,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Sarabun',sans-serif;
    background: linear-gradient(180deg, var(--pink) 0%, var(--blue) 320px, #F7FAFF 520px);
    background-attachment:fixed;
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #app-shell{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:transparent;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 20px 14px;
  }
  .topbar .greet-wrap{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:46px;height:46px;border-radius:50%;
    background:var(--white); display:flex;align-items:center;justify-content:center;
    font-size:22px; box-shadow:var(--shadow);
  }
  .greet-name{font-family:'Baloo 2';font-weight:700;font-size:17px;color:var(--ink);}
  .greet-room{font-size:12.5px;color:var(--ink-soft);}
  .bell-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--white);
    display:flex;align-items:center;justify-content:center;font-size:19px;
    box-shadow:var(--shadow); position:relative;
  }
  .bell-dot{
    position:absolute; top:9px; right:10px; width:9px;height:9px;border-radius:50%;
    background:var(--pink-deep); border:2px solid var(--white);
  }
  .page-title-row{padding:6px 20px 14px; display:flex; align-items:center; gap:10px;}
  .back-btn{
    width:38px;height:38px;border-radius:50%;border:none;background:var(--white);
    box-shadow:var(--shadow); font-size:17px; display:flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .page-title{font-family:'Baloo 2';font-weight:700;font-size:21px;margin:0;}

  /* ---------- Content ---------- */
  #content{flex:1; padding: 0 20px 110px; animation: fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Cards ---------- */
  .card{
    background:var(--white); border-radius:var(--radius); padding:18px;
    box-shadow:var(--shadow); margin-bottom:16px;
  }
  .points-card{
    background: linear-gradient(135deg, var(--pink-deep), var(--pink));
    color:#fff; border-radius:var(--radius); padding:22px;
    box-shadow: 0 14px 30px -14px rgba(255,122,170,0.55);
    margin-bottom:18px; position:relative; overflow:hidden;
  }
  .points-card .label{font-size:13px; opacity:.92; font-weight:600;}
  .points-card .value{font-family:'Baloo 2'; font-size:38px; font-weight:800; margin:4px 0 2px; display:flex; align-items:center; gap:8px;}
  .points-card .coin{display:inline-block; animation:none;}
  .points-card.bounce .coin{animation: coinBounce .6s ease;}
  @keyframes coinBounce{
    0%{transform:translateY(0) rotate(0);}
    30%{transform:translateY(-14px) rotate(-15deg);}
    55%{transform:translateY(0) rotate(10deg);}
    75%{transform:translateY(-6px) rotate(-6deg);}
    100%{transform:translateY(0) rotate(0);}
  }
  .points-card .sub{font-size:12.5px; opacity:.9;}

  .quick-grid{display:grid; grid-template-columns: 1fr 1fr; gap:14px; margin-bottom:8px;}
  .quick-btn{
    background:var(--white); border:none; border-radius:var(--radius);
    padding:18px 14px; text-align:left; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; transition:transform .15s ease;
  }
  .quick-btn:active{transform:scale(0.96);}
  .quick-btn .qicon{
    width:42px;height:42px;border-radius:14px; display:flex;align-items:center;justify-content:center;font-size:21px;
  }
  .quick-btn .qtitle{font-family:'Baloo 2'; font-weight:700; font-size:15px; color:var(--ink);}
  .quick-btn .qsub{font-size:11.5px; color:var(--ink-soft);}

  .section-title{font-family:'Baloo 2'; font-weight:700; font-size:16.5px; margin:22px 0 12px; display:flex; align-items:center; justify-content:space-between;}
  .section-title .link{font-size:12.5px; color:var(--blue-text); font-family:'Sarabun'; font-weight:600;}

  /* ---------- Search / filter ---------- */
  .search-row{display:flex; gap:10px; margin-bottom:14px;}
  .search-box{
    flex:1; background:var(--white); border-radius:16px; padding:12px 16px;
    display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);
  }
  .search-box input{border:none; outline:none; flex:1; font-size:14px; background:transparent;}
  .filter-chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px;}
  .chip{
    white-space:nowrap; padding:8px 16px; border-radius:20px; border:none;
    background:var(--white); font-size:13px; font-weight:600; color:var(--ink-soft);
    box-shadow: 0 4px 12px -6px rgba(0,0,0,0.08);
  }
  .chip.active{background:var(--pink-deep); color:#fff;}

  /* ---------- Item grid ---------- */
  .item-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .item-card{
    background:var(--white); border-radius:18px; overflow:hidden; box-shadow:var(--shadow);
    display:flex; flex-direction:column; border:none; text-align:left; padding:0;
  }
  .item-img{
    height:88px; display:flex; align-items:center; justify-content:center; font-size:36px;
    background: var(--blue);
  }
  .item-body{padding:12px 12px 14px;}
  .item-name{font-weight:700; font-size:14px; margin:0 0 4px;}
  .item-cat{font-size:11.5px; color:var(--ink-soft); margin-bottom:8px;}
  .status-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px;
  }
  .status-available{background:var(--green-bg); color:#1F9C6C;}
  .status-borrowed{background:var(--red-bg); color:#E1435A;}
  .status-repair{background:var(--yellow-bg); color:#B9790E;}

  /* ---------- List rows (deposit / lost&found / notif / history) ---------- */
  .list-row{
    background:var(--white); border-radius:18px; padding:14px; box-shadow:var(--shadow);
    display:flex; gap:12px; margin-bottom:12px; align-items:flex-start;
  }
  .row-icon{
    width:48px;height:48px;border-radius:14px; flex-shrink:0;
    display:flex;align-items:center;justify-content:center; font-size:22px; background:var(--pink);
  }
  .row-title{font-weight:700; font-size:14.5px; margin:0 0 3px;}
  .row-sub{font-size:12.5px; color:var(--ink-soft); line-height:1.5;}
  .row-meta{font-size:11px; color:var(--ink-soft); margin-top:6px;}
  .pill{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; margin-top:6px;}

  /* ---------- Tabs ---------- */
  .tabbar{display:flex; background:var(--white); border-radius:16px; padding:5px; box-shadow:var(--shadow); margin-bottom:16px;}
  .tabbtn{flex:1; border:none; background:transparent; padding:10px; border-radius:12px; font-weight:700; font-size:13.5px; color:var(--ink-soft);}
  .tabbtn.active{background:var(--blue-deep); color:#fff;}

  /* ---------- Buttons ---------- */
  .btn-primary{
    width:100%; padding:15px; border:none; border-radius:16px; font-weight:700; font-size:15px;
    background: linear-gradient(135deg, var(--pink-deep), #FF7FB2); color:#fff;
    box-shadow: 0 12px 24px -12px rgba(255,127,178,0.6);
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    width:100%; padding:14px; border-radius:16px; font-weight:700; font-size:14.5px;
    background:var(--blue); color:var(--blue-text); border:none;
  }
  .btn-ghost{
    width:100%; padding:13px; border-radius:16px; font-weight:700; font-size:14px;
    background:transparent; color:var(--ink-soft); border:2px solid #EEE7F2;
  }

  /* ---------- Forms ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:7px;}
  .field input, .field select, .field textarea{
    width:100%; padding:13px 14px; border-radius:14px; border:1.5px solid #F0E6EC;
    font-size:14px; outline:none; background:#FCFAFD;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--pink-deep);}
  .field textarea{resize:vertical; min-height:70px;}
  .duration-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .duration-opt{
    padding:12px 4px; text-align:center; border-radius:14px; border:1.5px solid #F0E6EC;
    background:#FCFAFD; font-size:13px; font-weight:600; color:var(--ink-soft);
  }
  .duration-opt.active{border-color:var(--pink-deep); background:var(--pink); color:var(--pink-text);}

  .upload-box{
    border:2px dashed #EAD9E3; border-radius:16px; padding:22px; text-align:center; background:#FCFAFD;
  }
  .upload-box .up-icon{font-size:26px; margin-bottom:6px;}
  .upload-box .up-text{font-size:12.5px; color:var(--ink-soft);}
  .preview-img{width:100%; border-radius:14px; margin-top:10px; max-height:160px; object-fit:cover;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(58,50,71,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.open{display:flex; animation:fadeIn .2s ease;}
  .modal-sheet{
    width:100%; max-width:480px; background:#F7FAFF; border-radius:26px 26px 0 0;
    padding:22px 20px 28px; max-height:88vh; overflow-y:auto;
    animation: slideUp .25s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:40px; height:5px; background:#E4DCE8; border-radius:10px; margin:0 auto 16px;}
  .modal-title{font-family:'Baloo 2'; font-weight:700; font-size:19px; margin:0 0 16px;}
  .modal-close{position:absolute; top:18px; right:20px; background:var(--white); border:none; width:34px; height:34px; border-radius:50%; font-size:15px; box-shadow:var(--shadow);}

  /* ---------- QR block ---------- */
  .qr-wrap{display:flex; flex-direction:column; align-items:center; padding:14px 0 6px;}
  .qr-code{
    width:170px; height:170px; border-radius:16px; background:#fff; border:1.5px solid #F0E6EC;
    display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(7,1fr);
    padding:14px; gap:3px; box-shadow:var(--shadow);
  }
  .qr-code div{border-radius:2px;}
  .qr-code .on{background:var(--ink);}
  .qr-code .off{background:transparent;}
  .qr-caption{font-size:12px; color:var(--ink-soft); margin-top:12px;}
  .qr-code-text{font-family:'Baloo 2'; font-weight:700; font-size:16px; color:var(--pink-text); letter-spacing:2px; margin-top:4px;}

  /* ---------- Empty state ---------- */
  .empty-state{text-align:center; padding:50px 20px 30px;}
  .empty-emoji{font-size:52px; margin-bottom:14px;}
  .empty-title{font-weight:700; font-size:15px; margin-bottom:6px;}
  .empty-sub{font-size:12.5px; color:var(--ink-soft);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:13px 22px; border-radius:30px;
    font-size:13.5px; font-weight:600; box-shadow:0 12px 24px -8px rgba(0,0,0,0.3);
    z-index:80; opacity:0; transition:all .3s ease; display:flex; align-items:center; gap:8px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:calc(100% - 32px); max-width:448px;
    background:var(--white); border-radius:24px; box-shadow:0 16px 34px -12px rgba(58,50,71,0.28);
    display:flex; justify-content:space-around; padding:10px 6px; z-index:40;
  }
  .nav-item{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 10px; border-radius:14px; color:var(--ink-soft); font-size:10.5px; font-weight:600;
  }
  .nav-item .nicon{font-size:19px;}
  .nav-item.active{color:var(--pink-text);}
  .nav-item.active .nicon{transform:translateY(-1px);}

  /* ---------- Auth ---------- */
  .auth-wrap{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:36px 26px;}
  .auth-logo{font-size:52px; text-align:center; margin-bottom:6px;}
  .auth-title{font-family:'Baloo 2'; font-weight:800; font-size:24px; text-align:center; color:var(--ink); margin:0 0 4px;}
  .auth-sub{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:28px;}
  .auth-toggle{display:flex; gap:8px; margin-bottom:22px; background:var(--white); padding:5px; border-radius:16px; box-shadow:var(--shadow);}
  .auth-toggle button{flex:1; padding:11px; border:none; border-radius:12px; font-weight:700; font-size:13.5px; background:transparent; color:var(--ink-soft);}
  .auth-toggle button.active{background:var(--pink-deep); color:#fff;}
  .divider-row{display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--ink-soft); font-size:12px;}
  .divider-row .line{flex:1; height:1px; background:#EFE6EC;}
  .line-btn{
    width:100%; padding:14px; border-radius:16px; border:1.5px solid #EFE6EC; background:#fff;
    font-weight:700; font-size:14px; color:#06C755; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  a{color:inherit;}
  ::selection{background:var(--pink-deep); color:#fff;}

  /* ---------- Real-data additions ---------- */
  .row-icon{overflow:hidden;}
  .row-icon img{width:100%; height:100%; object-fit:cover;}
  .qr-svg{background:#fff; padding:8px; border-radius:16px; line-height:0; box-shadow:var(--shadow);}
  .qr-svg svg{width:170px; height:170px;}
  .btn-row{display:flex; gap:8px; margin-top:10px;}
  .btn-row > button{flex:1; padding:11px; font-size:13.5px;}
  button:disabled{opacity:.6; cursor:not-allowed;}
  .modal-text{font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:14px;}
  #toast{pointer-events:none;}  /* toast ไม่บังปุ่มที่อยู่ข้างใต้ */
  .error-box{color:#be123c; background:#fff1f2; border:1px solid #fecdd3; padding:8px 12px; border-radius:10px; font-size:13px; margin-bottom:10px;}
</style>
</head>
<body>

<div id="app-shell">
  <div id="content"></div>
  <div class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="nav-item" data-nav="home"><span class="nicon">🏠</span>หน้าหลัก</button>
    <button class="nav-item" data-nav="borrow"><span class="nicon">☂️</span>ยืม-คืน</button>
    <button class="nav-item" data-nav="deposit"><span class="nicon">📦</span>ฝากของ</button>
    <button class="nav-item" data-nav="lostfound"><span class="nicon">🔍</span>ของหาย</button>
    <button class="nav-item" data-nav="profile"><span class="nicon">🙂</span>โปรไฟล์</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* ===================== MOCK DATA ===================== */
/* ===================== APP DATA (โหลดจริงจาก backend ทั้งหมด ไม่มี mock data) ===================== */
const user = { name: "", room: "", points: 0 };

const categories = ["ทั้งหมด","อุปกรณ์ทำความสะอาด","ซ่อมแซม","ความบันเทิง","อื่นๆ"];
// ระยะเวลายืมที่ระบบรองรับ (ต้องตรงกับ ALLOWED_DURATIONS ฝั่ง backend)
const DURATIONS = ["1 ชม.","1 วัน","3 วัน"];
// กติกาแต้ม (ต้องตรงกับ services.py ฝั่ง backend) — ใช้แสดงผลเท่านั้น การให้แต้มจริงทำที่ backend
const POINT_RULES = { returnOnTime: 10, depositHandedOff: 5, foundReturned: 20 };

let items = [], myBorrows = [];
let depositsData = [];
let foundData = [], lostData = [], incomingClaims = [], leaderboardData = [];
let notificationsData = [], activityData = [], recentActivity = [];
let unreadCount = 0;
let loading = {};   // loading[page] = true ระหว่างโหลดข้อมูลของหน้านั้น
let uploads = {};   // รูปที่ผู้ใช้เลือก (ย่อขนาดแล้ว) เก็บตาม key ของช่องอัปโหลด

/* ===================== API ===================== */
// เปลี่ยนค่านี้ถ้า backend รันอยู่คนละ host/port หรือ deploy ขึ้นเซิร์ฟเวอร์จริงแล้ว
const API_BASE_URL = "http://localhost:8000";
let authToken = localStorage.getItem('dsc_token') || null;

function parseApiError(data, fallback){
  if(!data) return fallback;
  if(typeof data.detail === 'string') return data.detail;
  if(Array.isArray(data.detail)){
    // FastAPI validation error format: [{loc:[...], msg:"...", type:"..."}]
    return data.detail.map(d=>{
      const field = Array.isArray(d.loc) ? d.loc[d.loc.length-1] : '';
      return (field ? field + ': ' : '') + (d.msg || 'ข้อมูลไม่ถูกต้อง');
    }).join(' / ');
  }
  return fallback;
}

/** เรียก backend จุดเดียว: แนบ token, แปลง error เป็นข้อความอ่านง่าย, จัดการ session หมดอายุ */
async function api(path, { method = 'GET', body, form, auth = true } = {}){
  const headers = {};
  if(auth && authToken) headers['Authorization'] = `Bearer ${authToken}`;
  let payload;
  if(form){ headers['Content-Type'] = 'application/x-www-form-urlencoded'; payload = new URLSearchParams(form); }
  else if(body !== undefined){ headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }

  let res;
  try{
    res = await fetch(API_BASE_URL + path, { method, headers, body: payload });
  }catch(e){
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบว่ารัน backend (docker compose up) แล้ว');
  }
  const data = await res.json().catch(()=>null);
  if(res.status === 401 && auth && authToken){
    handleSessionExpired();
    throw new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
  }
  if(!res.ok) throw new Error(parseApiError(data, 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง'));
  return data;
}

function handleSessionExpired(){
  authToken = null;
  localStorage.removeItem('dsc_token');
  state.page = 'auth';
  state.authError = 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';
  closeModal();
  render();
}

/* ===================== STATE ===================== */
let state = { page:"auth", filterCat:"ทั้งหมด", lfTab:"found", authMode:"login", authError:null, authLoading:false };

/* ===================== HELPERS ===================== */
function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

/** กัน XSS: ข้อความทุกอย่างที่ผู้ใช้พิมพ์ต้องผ่านฟังก์ชันนี้ก่อนแสดงผล */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showToast(msg, icon="✅"){
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${icon}</span><span>${esc(msg)}</span>`;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2600);
}
function openModal(html){
  uploads = {};
  document.getElementById('modalSheet').innerHTML = `<div class="modal-handle"></div>` + html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

/** backend เก็บเวลาเป็น UTC แต่ไม่ใส่ timezone มาด้วย — เติม Z ให้ browser แปลงเป็นเวลาไทยถูกต้อง */
function parseDate(s){
  if(!s) return null;
  return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
}
function fmtDateTime(s){
  const d = parseDate(s);
  return d ? d.toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}) : '';
}
function timeAgo(s){
  const d = parseDate(s); if(!d) return '';
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if(sec < 60) return 'เมื่อสักครู่';
  if(sec < 3600) return `${Math.floor(sec/60)} นาทีที่แล้ว`;
  if(sec < 86400) return `${Math.floor(sec/3600)} ชม.ที่แล้ว`;
  if(sec < 7*86400) return `${Math.floor(sec/86400)} วันที่แล้ว`;
  return fmtDateTime(s);
}

/** เดาอีโมจิจากชื่อของ เพื่อให้รายการดูง่ายขึ้นเวลาไม่มีรูป */
function guessEmoji(name, fallback){
  const n = (name || '').toLowerCase();
  const map = [
    ['กุญแจ','🔑'],['key','🔑'],['กระเป๋าสตางค์','👛'],['wallet','👛'],['กระเป๋า','👜'],['หูฟัง','🎧'],
    ['ร่ม','☂️'],['โทรศัพท์','📱'],['มือถือ','📱'],['phone','📱'],['บัตร','💳'],['แว่น','👓'],['นาฬิกา','⌚'],
    ['พัสดุ','📦'],['กล่อง','📦'],['ขวด','🧴'],['แก้ว','🥤'],['หนังสือ','📚'],['เสื้อ','👕'],['รองเท้า','👟'],
    ['ชาร์จ','🔌'],['ปากกา','🖊️'],['หมวก','🧢'],['เงิน','💵'],['โน้ตบุ๊ก','💻'],['แล็ปท็อป','💻'],['laptop','💻'],
    ['อาหาร','🍱'],['ขนม','🍪'],['ตุ๊กตา','🧸'],['จักรยาน','🚲'],
  ];
  for(const [k, e] of map){ if(n.includes(k)) return e; }
  return fallback;
}

/** ย่อรูปก่อนส่งขึ้น server (ด้านยาวสุด 900px, JPEG) เพื่อให้ส่งเร็วและไม่เปลืองฐานข้อมูล */
function compressImage(file, maxSize = 900, quality = 0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('อ่านไฟล์รูปไม่สำเร็จ'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      img.onload = ()=>{
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/** QR Code จริง (อ่านด้วยกล้องมือถือได้) — ถ้าโหลดไลบรารีไม่ได้ (ออฟไลน์) จะแสดงรหัสเป็นตัวอักษรแทน */
function qrBlock(codeText, caption = "แสดงรหัสนี้ตอนส่ง-รับของ"){
  let qrHtml = '';
  if(typeof qrcode !== 'undefined'){
    const qr = qrcode(0, 'M');
    qr.addData(codeText);
    qr.make();
    qrHtml = `<div class="qr-svg">${qr.createSvgTag({ cellSize: 5, margin: 2 })}</div>`;
  }
  return `<div class="qr-wrap">
    ${qrHtml}
    <div class="qr-caption">${esc(caption)}</div>
    <div class="qr-code-text">${esc(codeText)}</div>
  </div>`;
}

/** ปิดปุ่มระหว่างรอ server ตอบ — กันกดซ้ำ และคืนสภาพปุ่มถ้าเกิด error */
async function withBusy(btn, busyText, fn){
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = busyText; }
  try{
    return await fn();
  }catch(err){
    showToast(err.message, '⚠️');
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = original; }
  }
}

  return {label:"กำลังซ่อมแซม", cls:"status-repair", dot:"🟡"};
}

  catch(err){ showToast(err.message, '⚠️'); }
  loading[page] = false;
  if(state.page === page && authToken) render();
}

/* ===================== MAIN RENDER ===================== */
function render(){
  const content = document.getElementById('content');
  const nav = document.getElementById('bottomNav');
  if(state.page === "auth"){
    nav.style.display = "none";
    content.style.paddingBottom = "0";
    content.innerHTML = pageAuth();
  } else {
    nav.style.display = "flex";
    content.style.paddingBottom = "110px";
    const pages = {
      home: pageHome, borrow: pageBorrow, deposit: pageDeposit,
      lostfound: pageLostFound, profile: pageProfile, notifications: pageNotifications
    };
    content.innerHTML = pages[state.page] ? pages[state.page]() : pageHome();
    document.querySelectorAll('.nav-item').forEach(b=>{
      b.classList.toggle('active', b.dataset.nav === state.page);
    });
  }
}

/* ===================== AUTH FLOW ===================== */
async function completeLogin(){
  const me = await api('/me');
  user.room = me.username;
  user.name = me.full_name || '';
  goto('home');
}

function resetAppData(){
  items = []; myBorrows = []; depositsData = []; foundData = []; lostData = [];
  incomingClaims = []; leaderboardData = []; notificationsData = []; activityData = [];
  recentActivity = []; unreadCount = 0; loading = {};
  user.name = ''; user.room = ''; user.points = 0;
}

/* ===================== EVENTS (delegated) ===================== */
document.body.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-nav], [data-back], [data-authmode], [data-do], [data-cat], [data-item], [data-close], [data-lftab], [data-dur], [data-upload], [data-deposit], [data-return], [data-claim]');
  if(!t || t.disabled) return;

  if(t.dataset.nav){ goto(t.dataset.nav); return; }
  if(t.dataset.back !== undefined){ goto('home'); return; }
  if(t.dataset.authmode){ state.authMode = t.dataset.authmode; state.authError = null; render(); return; }
  if(t.dataset.cat){ state.filterCat = t.dataset.cat; render(); return; }
  if(t.dataset.lftab){ state.lfTab = t.dataset.lftab; render(); return; }
  if(t.dataset.close !== undefined){ closeModal(); return; }
  if(t.dataset.dur){
    document.querySelectorAll('.duration-opt').forEach(d=>d.classList.remove('active'));
    t.classList.add('active');
    return;
  }
  if(t.dataset.upload){ document.getElementById('fileInput_' + t.dataset.upload).click(); return; }
  if(t.dataset.deposit){
    const d = depositsData.find(x=>x.id==t.dataset.deposit);
    if(d) openModal(depositDetailModal(d));
    return;
  }
  if(t.dataset.claim){
    const f = foundData.find(x=>x.id==t.dataset.claim);
    if(f) openModal(claimModal(f));
    return;
  }
  if(t.dataset.item){
    const it = items.find(x=>x.id==t.dataset.item);
    if(it) openModal(itemModal(it));
    return;
  }
  if(t.dataset.return){
    const rec = myBorrows.find(b=>b.id==t.dataset.return);
    if(rec) openModal(returnModal(rec));
    return;
  }

  const id = t.dataset.id;
  switch(t.dataset.do){
    /* ---------- เข้าสู่ระบบ / สมัคร / ออก ---------- */
    case 'login': {
      const username = val('authUsername');
      const password = document.getElementById('authPassword').value;
      state.authUsername = username;
      if(!username || !password){ state.authError = 'กรอกหมายเลขห้องพักและรหัสผ่านให้ครบ'; render(); break; }
      state.authError = null; state.authLoading = true; render();
      try{
        const res = await api('/login', { method:'POST', form:{ username, password }, auth:false });
        authToken = res.access_token;
        localStorage.setItem('dsc_token', authToken);
        state.authLoading = false;
        await completeLogin();
        showToast('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับกลับมา!', '👋');
      }catch(err){
        state.authLoading = false; state.authError = err.message; render();
      }
      break;
    }
    case 'register': {
      const username = val('authUsername');
      const fullName = val('authFullName');
      const email = val('authEmail');
      const password = document.getElementById('authPassword').value;
      Object.assign(state, { authUsername: username, authFullName: fullName, authEmail: email });
      if(!username || !password){ state.authError = 'กรอกหมายเลขห้องพักและรหัสผ่านให้ครบ'; render(); break; }
      state.authError = null; state.authLoading = true; render();
      try{
        await api('/register', { method:'POST', auth:false,
          body:{ username, password, email: email || null, full_name: fullName || null } });
        const res = await api('/login', { method:'POST', form:{ username, password }, auth:false });
        authToken = res.access_token;
        localStorage.setItem('dsc_token', authToken);
        state.authLoading = false;
        await completeLogin();
        showToast('สมัครสมาชิกสำเร็จ ยินดีต้อนรับ!', '🎉');
      }catch(err){
        state.authLoading = false; state.authError = err.message; render();
      }
      break;
    }
    case 'logout':
      api('/logout', { method:'POST' }).catch(()=>{});
      authToken = null;
      localStorage.removeItem('dsc_token');
      resetAppData();
      state.page = 'auth'; state.authMode = 'login'; state.authError = null;
      render();
      break;

    /* ---------- ยืม-คืน ---------- */
    case 'confirm-borrow': {
      const durEl = document.querySelector('.duration-opt.active');
      const dur = durEl ? durEl.dataset.dur : DURATIONS[0];
      await withBusy(t, 'กำลังส่งคำขอ...', async ()=>{
        const record = await api(`/items/${t.dataset.itemId}/borrow`, { method:'POST', body:{ duration_label: dur } });
        openModal(borrowSuccessModal(record));
        loadPage('borrow');
      });
      break;
    }
    case 'confirm-return':
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        const res = await api(`/borrow/${t.dataset.record}/return`, { method:'POST',
          body:{ image_data: uploads.return || null, note: val('returnNote') || null } });
        closeModal();
        showToast(res.points_awarded > 0
          ? `คืนของสำเร็จ! ได้รับ +${res.points_awarded} แต้ม`
          : 'แจ้งคืนของสำเร็จ ขอบคุณที่ดูแลของส่วนกลาง!', res.points_awarded > 0 ? '🎉' : '✅');
        loadPage('borrow');
      });
      break;

    /* ---------- ฝากของ ---------- */
    case 'new-deposit': openModal(newDepositModal()); break;
    case 'confirm-deposit': {
      const item_name = val('depWhat'), recipient_username = val('depFor');
      if(!item_name || !recipient_username){ showToast('กรอก "ฝากอะไร" และ "ฝากให้ห้องไหน" ให้ครบ', '⚠️'); break; }
      await withBusy(t, 'กำลังสร้างรายการ...', async ()=>{
        const d = await api('/deposits', { method:'POST', body:{
          item_name, recipient_username, eta: val('depEta') || null, note: val('depNote') || null,
          image_data: uploads.deposit || null } });
        openModal(depositSuccessModal(d));
        loadPage('deposit');
      });
      break;
    }
    case 'collect-deposit':
      await withBusy(t, 'กำลังยืนยัน...', async ()=>{
        const d = await api(`/deposits/${id}/collect`, { method:'POST' });
        closeModal();
        showToast(d.direction === 'sent'
          ? `ส่งของถึงมือแล้ว! ได้รับ +${POINT_RULES.depositHandedOff} แต้ม`
          : 'ยืนยันรับของเรียบร้อย', d.direction === 'sent' ? '🎉' : '📥');
        loadPage('deposit');
      });
      break;
    case 'cancel-deposit':
      if(!confirm('ยกเลิกรายการฝากนี้ใช่ไหม?')) break;
      await withBusy(t, 'กำลังยกเลิก...', async ()=>{
        await api(`/deposits/${id}/cancel`, { method:'POST' });
        closeModal(); showToast('ยกเลิกรายการฝากแล้ว', '🚫');
        loadPage('deposit');
      });
      break;

    /* ---------- ของหายได้คืน ---------- */
    case 'new-found': openModal(newFoundModal()); break;
    case 'confirm-found': {
      const item_name = val('foundWhat'), location = val('foundWhere');
      if(!item_name || !location){ showToast('กรอก "เจออะไร" และ "เจอที่ไหน" ให้ครบ', '⚠️'); break; }
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        await api('/found', { method:'POST', body:{
          item_name, location, found_time: val('foundWhen') || null,
          emoji: guessEmoji(item_name, '🎁'), image_data: uploads.found || null } });
        closeModal();
        showToast('แจ้งเจอของเรียบร้อย ขอบคุณสำหรับความดีของคุณ!', '🎉');
        state.lfTab = 'found'; loadPage('lostfound');
      });
      break;
    }
    case 'new-lost': openModal(newLostModal()); break;
    case 'confirm-lost': {
      const item_name = val('lostWhat'), location_time = val('lostWhere');
      if(!item_name || !location_time){ showToast('กรอกชื่อของและสถานที่ที่หายให้ครบ', '⚠️'); break; }
      await withBusy(t, 'กำลังประกาศ...', async ()=>{
        await api('/lost', { method:'POST', body:{
          item_name, location_time, emoji: guessEmoji(item_name, '🔍'), image_data: uploads.lost || null } });
        closeModal();
        showToast('ประกาศตามหาของเรียบร้อยแล้ว', '📢');
        state.lfTab = 'lost'; loadPage('lostfound');
      });
      break;
    }
    case 'confirm-claim': {
      const detail = val('claimDetail');
      if(detail.length < 5){ showToast('อธิบายลักษณะของอย่างน้อย 5 ตัวอักษร', '⚠️'); break; }
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        await api(`/found/${id}/claims`, { method:'POST', body:{ detail } });
        closeModal();
        showToast('ส่งคำขอแล้ว รอผู้พบตรวจสอบ', '✋');
        loadPage('lostfound');
      });
      break;
    }
    case 'approve-claim':
      if(!confirm(`ยืนยันว่าห้อง ${t.dataset.who} เป็นเจ้าของจริง และจะคืนของให้?`)) break;
      await withBusy(t, '...', async ()=>{
        await api(`/claims/${id}/approve`, { method:'POST' });
        showToast(`คืนของให้เจ้าของแล้ว! ได้รับ +${POINT_RULES.foundReturned} แต้ม`, '🎉');
        loadPage('lostfound');
      });
      break;
    case 'reject-claim':
      await withBusy(t, '...', async ()=>{
        await api(`/claims/${id}/reject`, { method:'POST' });
        showToast('ปฏิเสธคำขอแล้ว', '❌');
        loadPage('lostfound');
      });
      break;
    case 'resolve-lost':
      await withBusy(t, 'กำลังปิดประกาศ...', async ()=>{
        await api(`/lost/${id}/resolve`, { method:'POST' });
        showToast('ดีใจด้วยที่เจอของแล้ว!', '😊');
        loadPage('lostfound');
      });
      break;
  }
});

/* รูปที่ผู้ใช้เลือก: ย่อขนาด → เก็บไว้ใน uploads[key] → แสดงตัวอย่าง (ส่งขึ้น server ตอนกดยืนยัน) */
document.body.addEventListener('change', async (e)=>{
  if(e.target.type !== 'file' || !e.target.files[0]) return;
  const key = e.target.id.replace('fileInput_', '');
  const box = e.target.closest('.upload-box');
  try{
    const dataUrl = await compressImage(e.target.files[0]);
    uploads[key] = dataUrl;
    let img = box.querySelector('.preview-img');
    if(!img){ img = document.createElement('img'); img.className = 'preview-img'; box.appendChild(img); }
    img.src = dataUrl;
    const txt = box.querySelector('.up-text'); if(txt) txt.textContent = 'แตะเพื่อเปลี่ยนรูป';
  }catch(err){
    showToast(err.message, '⚠️');
  }
});

/* ค้นหาของส่วนกลาง: กรองการ์ดในหน้าทันทีโดยไม่ re-render (ช่องค้นหาจะได้ไม่หลุดโฟกัส) */
document.body.addEventListener('input', (e)=>{
  if(e.target.id !== 'searchInput') return;
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.item-card').forEach(card=>{
    const match = !q || card.dataset.name.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  const empty = document.getElementById('searchEmpty');
  if(empty) empty.style.display = (q && shown===0) ? '' : 'none';
});

/* กด Enter ในหน้าเข้าสู่ระบบ = กดปุ่ม */
document.body.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && state.page === 'auth' && e.target.tagName === 'INPUT'){
    const btn = document.querySelector('.auth-wrap .btn-primary');
    if(btn && !btn.disabled) btn.click();
  }
});

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* trigger a little coin bounce whenever home page is shown */
function bouncePoints(){
  const card = document.getElementById('pointsCard');
  if(card){ card.classList.add('bounce'); setTimeout(()=>card.classList.remove('bounce'), 700); }
}
const _origGoto = goto;
goto = function(page){ _origGoto(page); if(page==='home') setTimeout(bouncePoints, 80); };

/* เช็กแจ้งเตือนใหม่ทุก 30 วินาที (อัปเดตจุดแดงที่กระดิ่ง + แต้ม) */
setInterval(async ()=>{
  if(!authToken || state.page === 'auth' || document.hidden) return;
  try{
    applySummary(await api('/summary/me'));
    updateBell();
    if(state.page === 'home' && !document.getElementById('modalOverlay').classList.contains('open')) render();
  }catch(e){ /* เงียบไว้ ไม่รบกวนผู้ใช้ */ }
}, 30000);

/* ===================== INIT: restore session if we have a token ===================== */
(async function initSession(){
  if(!authToken){ render(); return; }
  try{
    await completeLogin();
  }catch(err){
    if(state.page !== 'auth'){ state.page = 'auth'; }
    state.authError = err.message;
    render();
  }
})();
</script>
