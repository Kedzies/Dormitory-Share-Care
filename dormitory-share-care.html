<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F766E">
<title>Dormitory Share & Care</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%230F766E'/%3E%3Cpath d='M13 22.5 24 13l11 9.5V35H13z' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linejoin='round'/%3E%3Cpath d='M24 31.5s-5-3-5-6.3a2.6 2.6 0 0 1 5-1 2.6 2.6 0 0 1 5 1c0 3.3-5 6.3-5 6.3z' fill='%23FBBF24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* brand */
    --brand: #0F766E;
    --brand-600: #0D6B64;
    --brand-700: #115E59;
    --brand-50: #F0FDFA;
    --brand-100: #CCFBF1;
    --accent: #F59E0B;
    --accent-50: #FFFBEB;

    /* neutrals */
    --bg: #F5F7F8;
    --surface: #FFFFFF;
    --surface-2: #F8FAFB;
    --border: #E4E8EB;
    --border-strong: #D3D9DE;
    --ink: #0F1C24;
    --ink-2: #3B4A54;
    --ink-soft: #6B7A86;

    /* semantic tones (soft bg / strong fg) */
    --t-teal-bg:#E6F6F3;   --t-teal-fg:#0F766E;
    --t-sky-bg:#E8F2FC;    --t-sky-fg:#1D6FB8;
    --t-amber-bg:#FEF4E2;  --t-amber-fg:#B45309;
    --t-rose-bg:#FDEDEF;   --t-rose-fg:#BE2F45;
    --t-violet-bg:#F0EDFC; --t-violet-fg:#5B45C2;
    --t-green-bg:#E7F6EC;  --t-green-fg:#15803D;
    --t-slate-bg:#EEF1F3;  --t-slate-fg:#4B5A66;

    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
    --shadow-sm: 0 1px 2px rgba(15,28,36,.05);
    --shadow: 0 1px 2px rgba(15,28,36,.04), 0 4px 16px -6px rgba(15,28,36,.08);
    --shadow-lg: 0 10px 40px -12px rgba(15,28,36,.25);
    --focus: 0 0 0 3px rgba(15,118,110,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
  }
  h1,h2,h3{margin:0; letter-spacing:-.01em;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  svg.i{flex-shrink:0; display:inline-block; vertical-align:-0.18em;}
  #app-shell{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 0 16px;
  }
  .topbar .greet-wrap{display:flex;align-items:center;gap:12px;}
  .avatar{
    width:44px;height:44px;border-radius:50%;
    background:var(--brand); color:#fff; display:flex;align-items:center;justify-content:center;
    font-weight:600; font-size:15px; letter-spacing:.02em;
  }
  .greet-hello{font-size:12.5px;color:var(--ink-soft);}
  .greet-name{font-weight:600;font-size:16px;color:var(--ink);line-height:1.3;}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;color:var(--ink-2);
    position:relative; transition:background .15s, border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-2); border-color:var(--border-strong);}
  .bell-dot{
    position:absolute; top:9px; right:10px; width:8px;height:8px;border-radius:50%;
    background:#E5484D; box-shadow:0 0 0 2px var(--surface);
  }
  .page-title-row{padding:20px 0 18px; display:flex; align-items:center; gap:12px;}
  .page-title{font-weight:700;font-size:20px;}

  /* ---------- Content ---------- */
  #content{flex:1; padding: 0 16px 110px; animation: fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Cards ---------- */
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px;
    box-shadow:var(--shadow-sm); margin-bottom:16px;
  }
  .points-card{
    background: linear-gradient(135deg, var(--brand-700) 0%, var(--brand) 60%, #14917F 100%);
    color:#fff; border-radius:20px; padding:22px 22px 20px;
    box-shadow: 0 12px 30px -14px rgba(15,118,110,.6);
    margin-bottom:20px; position:relative; overflow:hidden; isolation:isolate;
  }
  .points-card::before, .points-card::after{
    content:""; position:absolute; border-radius:50%; z-index:-1;
    border:1px solid rgba(255,255,255,.14);
  }
  .points-card::before{width:220px;height:220px; right:-70px; top:-90px; background:rgba(255,255,255,.05);}
  .points-card::after{width:140px;height:140px; right:30px; bottom:-90px;}
  .points-card .label{font-size:13px; opacity:.85; font-weight:500; display:flex; align-items:center; gap:6px;}
  .points-card .value{font-size:36px; font-weight:700; margin:6px 0 14px; display:flex; align-items:center; gap:10px; letter-spacing:-.02em; line-height:1.1;}
  .points-card .value small{font-size:15px; font-weight:500; opacity:.85; letter-spacing:0;}
  .coin{
    width:38px;height:38px;border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg,#FCD34D,#F59E0B); color:#7C4A03;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 10px -4px rgba(0,0,0,.35);
  }
  .points-card.bounce .coin{animation: coinBounce .6s ease;}
  @keyframes coinBounce{
    0%{transform:translateY(0) rotate(0);}
    30%{transform:translateY(-10px) rotate(-12deg);}
    55%{transform:translateY(0) rotate(8deg);}
    75%{transform:translateY(-4px) rotate(-4deg);}
    100%{transform:translateY(0) rotate(0);}
  }
  .rules{display:flex; flex-wrap:wrap; gap:6px;}
  .rule{font-size:11.5px; font-weight:500; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.16);}

  .quick-grid{display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:8px;}
  .quick-btn{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px; text-align:left; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:12px; transition:transform .15s ease, box-shadow .15s, border-color .15s;
  }
  .quick-btn:hover{border-color:var(--border-strong); box-shadow:var(--shadow);}
  .quick-btn:active{transform:scale(0.98);}
  .quick-btn .qtitle{font-weight:600; font-size:15px; color:var(--ink);}
  .quick-btn .qsub{font-size:12px; color:var(--ink-soft); margin-top:2px; line-height:1.4;}

  .section-title{font-weight:600; font-size:15.5px; margin:26px 0 12px; display:flex; align-items:center; gap:8px; color:var(--ink);}
  .section-title .count{font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--t-slate-bg); padding:1px 8px; border-radius:20px;}

  /* ---------- Icon tiles ---------- */
  .tile{width:44px;height:44px;border-radius:12px; display:flex;align-items:center;justify-content:center; flex-shrink:0; overflow:hidden;}
  .tile img{width:100%; height:100%; object-fit:cover;}
  .t-teal{background:var(--t-teal-bg); color:var(--t-teal-fg);}
  .t-sky{background:var(--t-sky-bg); color:var(--t-sky-fg);}
  .t-amber{background:var(--t-amber-bg); color:var(--t-amber-fg);}
  .t-rose{background:var(--t-rose-bg); color:var(--t-rose-fg);}
  .t-violet{background:var(--t-violet-bg); color:var(--t-violet-fg);}
  .t-green{background:var(--t-green-bg); color:var(--t-green-fg);}
  .t-slate{background:var(--t-slate-bg); color:var(--t-slate-fg);}

  /* ---------- Search / filter ---------- */
  .search-row{display:flex; gap:10px; margin-bottom:12px;}
  .search-box{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:0 14px; height:46px;
    display:flex; align-items:center; gap:10px; color:var(--ink-soft); transition:border-color .15s, box-shadow .15s;
  }
  .search-box:focus-within{border-color:var(--brand); box-shadow:var(--focus);}
  .search-box input{border:none; outline:none; flex:1; font-size:14.5px; background:transparent; color:var(--ink);}
  .filter-chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .chip{
    white-space:nowrap; padding:7px 14px; border-radius:20px; border:1px solid var(--border);
    background:var(--surface); font-size:13px; font-weight:500; color:var(--ink-2); transition:all .15s;
  }
  .chip:hover{border-color:var(--border-strong);}
  .chip.active{background:var(--ink); border-color:var(--ink); color:#fff;}

  /* ---------- Item grid ---------- */
  .item-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .item-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; text-align:left; padding:0; transition:box-shadow .15s, border-color .15s, transform .15s;
  }
  .item-card:hover{border-color:var(--border-strong); box-shadow:var(--shadow); transform:translateY(-1px);}
  .item-img{
    height:104px; display:flex; align-items:center; justify-content:center; position:relative;
    background-image:radial-gradient(rgba(15,28,36,.07) 1px, transparent 1px); background-size:14px 14px;
  }
  .item-img .ring{
    position:relative; width:60px;height:60px;border-radius:18px; background:var(--surface);
    display:flex;align-items:center;justify-content:center; box-shadow:0 6px 16px -8px rgba(15,28,36,.35);
  }
  .item-img.t-teal{background-color:var(--t-teal-bg);} .item-img.t-sky{background-color:var(--t-sky-bg);}
  .item-img.t-amber{background-color:var(--t-amber-bg);} .item-img.t-violet{background-color:var(--t-violet-bg);}
  .item-img.t-rose{background-color:var(--t-rose-bg);} .item-img.t-slate{background-color:var(--t-slate-bg);}
  .item-body{padding:12px 14px 14px;}
  .item-name{font-weight:600; font-size:14.5px; margin:0 0 2px; color:var(--ink);}
  .item-cat{font-size:12px; color:var(--ink-soft); margin-bottom:10px;}
  .status-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    padding:3px 10px 3px 8px; border-radius:20px;
  }
  .status-badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}
  .status-available{background:var(--t-green-bg); color:var(--t-green-fg);}
  .status-borrowed{background:var(--t-rose-bg); color:var(--t-rose-fg);}
  .status-repair{background:var(--t-amber-bg); color:var(--t-amber-fg);}

  /* ---------- List rows ---------- */
  .list-row{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow-sm);
    display:flex; gap:14px; margin-bottom:10px; align-items:flex-start; transition:border-color .15s;
  }
  .list-row.clickable{cursor:pointer;}
  .list-row.clickable:hover{border-color:var(--border-strong);}
  .list-row.highlight{border-color:var(--brand); box-shadow:0 0 0 3px rgba(15,118,110,.08);}
  .list-row.danger{border-color:#F3B4BD; box-shadow:0 0 0 3px rgba(190,47,69,.06);}
  .row-main{flex:1; min-width:0;}
  .row-title{font-weight:600; font-size:14.5px; margin:0 0 2px; color:var(--ink);}
  .row-sub{font-size:13px; color:var(--ink-2); line-height:1.5;}
  .row-meta{font-size:12px; color:var(--ink-soft); margin-top:4px; display:flex; align-items:center; gap:5px;}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; margin-top:8px;}
  .pill + .pill{margin-left:4px;}

  /* ---------- Tabs ---------- */
  .tabbar{display:flex; background:var(--t-slate-bg); border-radius:12px; padding:4px; margin-bottom:18px; gap:2px;}
  .tabbtn{flex:1; border:none; background:transparent; padding:9px 8px; border-radius:9px; font-weight:500; font-size:13.5px; color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center; gap:6px; transition:all .15s;}
  .tabbtn.active{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(15,28,36,.1);}

  /* ---------- Buttons ---------- */
  .btn-primary, .btn-secondary, .btn-ghost, .btn-danger{
    width:100%; height:48px; padding:0 18px; border-radius:12px; font-weight:600; font-size:14.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; transition:background .15s, transform .1s, border-color .15s;
  }
  .btn-primary{border:none; background:var(--brand); color:#fff; box-shadow:0 1px 2px rgba(15,28,36,.1), inset 0 1px 0 rgba(255,255,255,.08);}
  .btn-primary:hover{background:var(--brand-600);}
  .btn-primary:active, .btn-secondary:active, .btn-ghost:active{transform:scale(0.99);}
  .btn-secondary{height:40px; font-size:13.5px; background:var(--brand-50); color:var(--brand); border:1px solid #BFE8E1;}
  .btn-secondary:hover{background:var(--brand-100);}
  .btn-ghost{background:var(--surface); color:var(--ink-2); border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-2); border-color:var(--border-strong);}
  .btn-danger{background:var(--surface); color:var(--t-rose-fg); border:1px solid #F3C4CB;}
  .btn-danger:hover{background:var(--t-rose-bg);}
  .btn-inline{width:auto; margin-top:10px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; height:46px; padding:0 14px; border-radius:12px; border:1px solid var(--border-strong);
    font-size:14.5px; outline:none; background:var(--surface); color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  .field input::placeholder, .field textarea::placeholder{color:#9AA7B1;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand); box-shadow:var(--focus);}
  .field textarea{resize:vertical; min-height:84px; height:auto; padding:12px 14px;}
  .dt-wrap{position:relative; cursor:pointer;}
  .field .dt-input{padding-right:44px; cursor:pointer; color:var(--ink);}
  .dt-input::-webkit-calendar-picker-indicator{position:absolute; inset:0; width:auto; height:auto; opacity:0; cursor:pointer;}
  .dt-icon{position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--brand); pointer-events:none; display:flex;}
  .field-hint{font-size:12px; color:var(--ink-soft); margin-top:5px;}
  .duration-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .duration-opt{
    padding:12px 4px; text-align:center; border-radius:12px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:14px; font-weight:500; color:var(--ink-2); cursor:pointer; transition:all .15s;
  }
  .duration-opt.active{border-color:var(--brand); background:var(--brand-50); color:var(--brand); box-shadow:var(--focus); font-weight:600;}

  .upload-box{
    border:1.5px dashed var(--border-strong); border-radius:12px; padding:20px; text-align:center; background:var(--surface-2);
    cursor:pointer; transition:border-color .15s, background .15s;
  }
  .upload-box:hover{border-color:var(--brand); background:var(--brand-50);}
  .upload-box .up-icon{width:44px; height:44px; margin:0 auto 8px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--brand);}
  .upload-box .up-text{font-size:13px; color:var(--ink-2); font-weight:500;}
  .upload-box .up-hint{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .preview-img{width:100%; border-radius:10px; margin-top:12px; max-height:180px; object-fit:cover; display:block;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,28,36,0.45); display:none; backdrop-filter:blur(2px);
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.open{display:flex; animation:fadeIn .2s ease;}
  .modal-sheet{
    width:100%; max-width:520px; background:var(--surface); border-radius:22px 22px 0 0; position:relative;
    padding:12px 20px 26px; max-height:90vh; overflow-y:auto;
    animation: slideUp .25s ease; box-shadow:var(--shadow-lg);
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:36px; height:4px; background:var(--border-strong); border-radius:10px; margin:0 auto 18px;}
  .modal-head{display:flex; align-items:center; gap:12px; margin-bottom:16px; padding-right:40px;}
  .modal-title{font-weight:700; font-size:18px; margin:0;}
  .modal-close{position:absolute; top:18px; right:18px; width:34px; height:34px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center;}
  .modal-close:hover{background:var(--surface-2); color:var(--ink);}
  .modal-text{font-size:13.5px; color:var(--ink-2); line-height:1.65; margin:0 0 14px;}
  .info-box{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; font-size:13px; line-height:1.55; margin:14px 0;}
  .info-box .i{margin-top:1px;}
  .detail-list{border:1px solid var(--border); border-radius:12px; margin:12px 0 14px; overflow:hidden;}
  .detail-list > div{display:flex; justify-content:space-between; gap:12px; padding:10px 14px; font-size:13.5px;}
  .detail-list > div + div{border-top:1px solid var(--border);}
  .detail-list dt{color:var(--ink-soft); margin:0;}
  .detail-list dd{margin:0; font-weight:500; text-align:right; color:var(--ink);}

  /* ---------- QR block ---------- */
  .qr-wrap{display:flex; flex-direction:column; align-items:center; padding:18px; margin-top:6px; border-radius:16px; background:var(--surface-2); border:1px solid var(--border);}
  .qr-svg{background:#fff; padding:8px; border-radius:12px; line-height:0; border:1px solid var(--border);}
  .qr-svg svg{width:168px; height:168px;}
  .qr-caption{font-size:12.5px; color:var(--ink-soft); margin-top:12px;}
  .qr-code-text{font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; font-weight:600; font-size:18px; color:var(--ink); letter-spacing:3px; margin-top:4px;}

  /* ---------- Empty state ---------- */
  .empty-state{text-align:center; padding:40px 24px 32px; border:1px dashed var(--border-strong); border-radius:var(--radius); background:var(--surface);}
  .empty-art{position:relative; width:84px; height:84px; margin:0 auto 16px;}
  .empty-art .disc{position:absolute; inset:0; border-radius:50%; display:flex; align-items:center; justify-content:center;}
  .empty-art::before{content:""; position:absolute; inset:-10px; border-radius:50%; border:1px dashed var(--border-strong);}
  .empty-art::after{content:""; position:absolute; width:10px; height:10px; border-radius:50%; background:var(--accent); top:-4px; right:2px; box-shadow:-86px 70px 0 -2px var(--brand-100);}
  .empty-title{font-weight:600; font-size:15px; margin-bottom:4px; color:var(--ink);}
  .empty-sub{font-size:13px; color:var(--ink-soft);}
  .spinner{width:22px; height:22px; border-radius:50%; border:2.5px solid var(--brand-100); border-top-color:var(--brand); animation:spin .8s linear infinite;}
  .spinner.sm{width:16px; height:16px; border-width:2px; border-color:rgba(255,255,255,.35); border-top-color:#fff;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-state{display:flex; flex-direction:column; align-items:center; gap:12px; padding:56px 0; color:var(--ink-soft); font-size:13.5px;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(16px);
    background:var(--ink); color:#fff; padding:12px 18px 12px 14px; border-radius:12px; max-width:calc(100% - 32px);
    font-size:14px; font-weight:500; box-shadow:var(--shadow-lg);
    z-index:80; opacity:0; transition:all .25s ease; display:flex; align-items:center; gap:10px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .ti{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .toast .ti.ok{background:#22A06B;} .toast .ti.err{background:#E5484D;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{

let foundData = [], lostData = [], incomingClaims = [], leaderboardData = [];

/* ===================== API ===================== */
// เปลี่ยนค่านี้ถ้า backend รันอยู่คนละ host/port หรือ deploy ขึ้นเซิร์ฟเวอร์จริงแล้ว
const API_BASE_URL = "http://localhost:8000";
let authToken = localStorage.getItem('dsc_token') || null;

function parseApiError(data, fallback){
  if(!data) return fallback;
  if(typeof data.detail === 'string') return data.detail;
  if(Array.isArray(data.detail)){
    // FastAPI validation error format: [{loc:[...], msg:"...", type:"..."}]
    return data.detail.map(d=>{
      const field = Array.isArray(d.loc) ? d.loc[d.loc.length-1] : '';
      return (field ? field + ': ' : '') + (d.msg || 'ข้อมูลไม่ถูกต้อง');
    }).join(' / ');
  }
  return fallback;
}

/** เรียก backend จุดเดียว: แนบ token, แปลง error เป็นข้อความอ่านง่าย, จัดการ session หมดอายุ */
async function api(path, { method = 'GET', body, form, auth = true } = {}){
  const headers = {};
  if(auth && authToken) headers['Authorization'] = `Bearer ${authToken}`;
  let payload;
  if(form){ headers['Content-Type'] = 'application/x-www-form-urlencoded'; payload = new URLSearchParams(form); }
  else if(body !== undefined){ headers['Content-Type'] = 'application/json'; payload = JSON.stringify(body); }

  let res;
  try{
    res = await fetch(API_BASE_URL + path, { method, headers, body: payload });
  }catch(e){
    throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบว่ารัน backend (docker compose up) แล้ว');
  }
  const data = await res.json().catch(()=>null);
  if(res.status === 401 && auth && authToken){
    handleSessionExpired();
    throw new Error('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
  }
  if(!res.ok) throw new Error(parseApiError(data, 'เกิดข้อผิดพลาด ลองใหม่อีกครั้ง'));
  return data;
}

function handleSessionExpired(){
  authToken = null;
  localStorage.removeItem('dsc_token');
  state.page = 'auth';
  state.authError = 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';
  closeModal();
  render();
}

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function initials(s){
  const t = String(s || '').trim();
  if(!t) return '?';
  // ภาษาไทย: ใช้พยัญชนะตัวแรก (ข้ามสระหน้า เ แ โ ใ ไ) — ตัดสองตัวแล้วอ่านไม่ออก
  const thai = t.match(/[ก-ฮ]/);
  if(thai && /^[฀-๿]/.test(t)) return thai[0];
  const words = t.split(/[\s\-_.]+/).filter(Boolean);
  const alnum = w => (w.match(/[A-Za-z0-9]/) || [''])[0];
  return (words.length > 1 ? alnum(words[0]) + alnum(words[1]) : t.replace(/[^A-Za-z0-9]/g, '').slice(0, 2)).toUpperCase() || '?';
}

/** backend เก็บเวลาเป็น UTC แต่ไม่ใส่ timezone มาด้วย — เติม Z ให้ browser แปลงเป็นเวลาไทยถูกต้อง */
function parseDate(s){
  if(!s) return null;
  return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z');
}
function fmtDateTime(s){
  const d = parseDate(s);
  return d ? d.toLocaleString('th-TH', {dateStyle:'medium', timeStyle:'short'}) : '';
}
function timeAgo(s){
  const d = parseDate(s); if(!d) return '';
  const sec = Math.floor((Date.now() - d.getTime()) / 1000);
  if(sec < 60) return 'เมื่อสักครู่';
  if(sec < 3600) return `${Math.floor(sec/60)} นาทีที่แล้ว`;
  if(sec < 86400) return `${Math.floor(sec/3600)} ชม.ที่แล้ว`;
  if(sec < 7*86400) return `${Math.floor(sec/86400)} วันที่แล้ว`;
  return fmtDateTime(s);
}

/** เดาอีโมจิจากชื่อของ เพื่อให้รายการดูง่ายขึ้นเวลาไม่มีรูป */
function guessEmoji(name, fallback){
  const n = (name || '').toLowerCase();
  const map = [
    ['กุญแจ','🔑'],['key','🔑'],['กระเป๋าสตางค์','👛'],['wallet','👛'],['กระเป๋า','👜'],['หูฟัง','🎧'],
    ['ร่ม','☂️'],['โทรศัพท์','📱'],['มือถือ','📱'],['phone','📱'],['บัตร','💳'],['แว่น','👓'],['นาฬิกา','⌚'],
    ['พัสดุ','📦'],['กล่อง','📦'],['ขวด','🧴'],['แก้ว','🥤'],['หนังสือ','📚'],['เสื้อ','👕'],['รองเท้า','👟'],
    ['ชาร์จ','🔌'],['ปากกา','🖊️'],['หมวก','🧢'],['เงิน','💵'],['โน้ตบุ๊ก','💻'],['แล็ปท็อป','💻'],['laptop','💻'],
    ['อาหาร','🍱'],['ขนม','🍪'],['ตุ๊กตา','🧸'],['จักรยาน','🚲'],
  ];
  for(const [k, e] of map){ if(n.includes(k)) return e; }
  return fallback;
}

/** ย่อรูปก่อนส่งขึ้น server (ด้านยาวสุด 900px, JPEG) เพื่อให้ส่งเร็วและไม่เปลืองฐานข้อมูล */
function compressImage(file, maxSize = 900, quality = 0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('อ่านไฟล์รูปไม่สำเร็จ'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      img.onload = ()=>{
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/** QR Code จริง (อ่านด้วยกล้องมือถือได้) — ถ้าโหลดไลบรารีไม่ได้ (ออฟไลน์) จะแสดงรหัสเป็นตัวอักษรแทน */
function qrBlock(codeText, caption = "แสดงรหัสนี้ตอนส่ง-รับของ"){
  let qrHtml = '';
  if(typeof qrcode !== 'undefined'){
    const qr = qrcode(0, 'M');
    qr.addData(codeText);
    qr.make();
    qrHtml = `<div class="qr-svg">${qr.createSvgTag({ cellSize: 5, margin: 2 })}</div>`;
  }
  return `<div class="qr-wrap">
    ${qrHtml}
    <div class="qr-caption">${esc(caption)}</div>
    <div class="qr-code-text">${esc(codeText)}</div>
  </div>`;
}

/* ---------- ช่องเลือกวัน-เวลา (ปฏิทินของเบราว์เซอร์) ---------- */
/** Date -> ค่าของ <input type="datetime-local"> (YYYY-MM-DDTHH:MM ตามเวลาเครื่อง) */
function toLocalInput(d){
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/** ช่องวัน-เวลา: แตะตรงไหนก็เปิดหน้าต่างปฏิทินขึ้นมาให้เลือก */
function dateTimeField(id, label, { min, max, value, hint } = {}){
  return `<div class="field">
    <label for="${id}">${label}</label>
    <div class="dt-wrap">
      <input id="${id}" class="dt-input" type="datetime-local"
        ${min ? `min="${toLocalInput(min)}"` : ''} ${max ? `max="${toLocalInput(max)}"` : ''} ${value ? `value="${toLocalInput(value)}"` : ''}>
      <span class="dt-icon">${ico('calendar', 18)}</span>
    </div>
    ${hint ? `<div class="field-hint">${hint}</div>` : ''}
  </div>`;
}
/** อ่านค่าที่เลือกเป็นข้อความไทย เช่น "7 ต.ค. 2569 20:00 น." (ว่าง = '') */
function pickedDateTime(id){
  const v = val(id);
  if(!v) return '';
  const d = new Date(v);
  if(isNaN(d)) return '';
  return d.toLocaleString('th-TH', { dateStyle:'medium', timeStyle:'short' }) + ' น.';
}

function pill(text, tone){
  return `<span class="pill t-${tone}">${text}</span>`;
}
function val(id){ const e = document.getElementById(id); return e ? e.value.trim() : ''; }

/** ปิดปุ่มระหว่างรอ server ตอบ — กันกดซ้ำ และคืนสภาพปุ่มถ้าเกิด error */
async function withBusy(btn, busyText, fn){
  const original = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner sm"></span>${busyText}`; }
  try{
    return await fn();
  }catch(err){
    showToast(err.message, '⚠️');
    if(btn && document.body.contains(btn)){ btn.disabled = false; btn.innerHTML = original; }
  }
}

/** ป้ายสถานะจากจำนวนที่ว่างจริง (backend คำนวณ available_count ให้แล้ว) */
function availMeta(i){
  if(i.status==="repair") return {label:"กำลังซ่อมแซม", cls:"status-repair"};
  if(i.status==="retired") return {label:"ปิดใช้งาน", cls:"status-retired"};
  if(i.status==="borrowed" || !i.available_count) return {label:"ถูกยืมหมด", cls:"status-borrowed"};
  return {label:`ว่าง ${i.available_count} ชิ้น`, cls:"status-available"};
}

/* ===================== DATA LOADING ===================== */
function applySummary(s){
  user.room = s.username;
  user.points = s.points;
  unreadCount = s.unread_notifications;
  recentActivity = s.recent_activity;
}
function updateBell(){
  const dot = document.querySelector('.bell-dot');
  if(dot) dot.style.display = unreadCount > 0 ? '' : 'none';
}

const pageLoaders = {
  home: async ()=>{ applySummary(await api('/summary/me')); },
  borrow: async ()=>{
    const [rawItems, rawBorrows] = await Promise.all([api('/items'), api('/borrow/me')]);
    items = rawItems.map(i => ({ id:i.id, name:i.name, cat:i.category, emoji:i.emoji, status:i.status,
      quantity:i.quantity, available_count:i.available_count, borrowed_count:i.borrowed_count,
      waitlist_count:i.waitlist_count, my_queue_position:i.my_queue_position }));
    myBorrows = rawBorrows;
  },
  deposit: async ()=>{ depositsData = await api('/deposits/me'); },
  lostfound: async ()=>{
    [foundData, lostData, incomingClaims, leaderboardData] = await Promise.all([
      api('/found'), api('/lost'), api('/claims/incoming'), api('/leaderboard'),
    ]);
  },
  profile: async ()=>{
    const [s, a, b] = await Promise.all([api('/summary/me'), api('/activity/me'), api('/badges/me')]);
    applySummary(s); activityData = a; badgesData = b;
  },
  admin: async ()=>{
    if(!user.isAdmin) return;
    const tab = state.adminTab;
    if(tab === 'overview'){
      [adminData.overview, adminData.borrows] = await Promise.all([api('/admin/overview'), api('/admin/borrows?status=active')]);
      state.adminBorrowFilter = 'active';
    }
    if(tab === 'items') adminData.items = await api('/admin/items');
    if(tab === 'borrows') adminData.borrows = await api('/admin/borrows?status=' + state.adminBorrowFilter);
    if(tab === 'deposits') adminData.deposits = await api('/admin/deposits?status=' + state.adminDepositFilter);
    if(tab === 'users') adminData.users = await api('/admin/users');
  },
  notifications: async ()=>{
    notificationsData = await api('/notifications');
    if(notificationsData.some(n => !n.is_read)) await api('/notifications/read-all', { method:'POST' });
    unreadCount = 0;
  },
};

async function loadPage(page){
  const loader = pageLoaders[page];
  if(!loader || !authToken) return;
  loading[page] = true;
  if(state.page === page) render();
  try{ await loader(); }
  catch(err){ showToast(err.message, '⚠️'); }
  loading[page] = false;
  if(state.page === page && authToken) render();
}

function goto(page){ state.page = page; render(); window.scrollTo(0,0); loadPage(page); }

function loadingState(){ return `<div class="loading-state"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>`; }

const DEPOSIT_STATUS = {
  waiting:   ['รอรับของ', 'amber'],
  collected: ['รับแล้ว', 'green'],
  cancelled: ['ยกเลิก', 'slate'],
};

function depositRow(d){
  const [label, tone] = DEPOSIT_STATUS[d.status] || DEPOSIT_STATUS.waiting;
  const sent = d.direction === 'sent';
  const who = sent ? `ฝากให้ห้อง ${esc(d.recipient_username)}` : `จากห้อง ${esc(d.depositor_username)}`;
  return `<div class="list-row clickable" data-deposit="${d.id}">
    ${thumb(d.image_data, iconFor(null, d.item_name, 'package'), sent ? 'teal' : 'sky')}
    <div class="row-main">
      <div class="row-title">${esc(d.item_name)}</div>
      <div class="row-sub">${who}${d.note ? ' · ' + esc(d.note) : ''}</div>
      ${d.eta ? `<div class="row-meta">${ico('calendar', 13)}นัดรับ: ${esc(d.eta)}</div>` : `<div class="row-meta">${ico('clock', 13)}${timeAgo(d.created_at)}</div>`}
      ${pill(label, tone)}
    </div>
    <span style="color:var(--ink-soft); align-self:center;">${ico('chevron', 18)}</span>
  </div>`;
}

function pageDeposit(){
  if(loading.deposit && depositsData.length===0) return topbar("ระบบฝากของ") + loadingState();
  const received = depositsData.filter(d => d.direction==='received' && d.status==='waiting');
  const sent = depositsData.filter(d => d.direction==='sent' && d.status==='waiting');
  const done = depositsData.filter(d => d.status!=='waiting');
  const section = (icon, title, list) => `<div class="section-title">${ico(icon, 18)}${title} <span class="count">${list.length}</span></div>${list.map(depositRow).join("")}`;
  return topbar("ระบบฝากของ") + `
    <div class="btn-pair">
      <button class="btn-primary" data-do="new-deposit">${ico('plus', 18, 2.2)}ฝากของใหม่</button>
      <button class="btn-ghost" data-do="open-scanner">${ico('scan', 18)}สแกน QR ส่งของ</button>
    </div>
    ${depositsData.length===0 ? `<div style="margin-top:16px;">${emptyState("package","ยังไม่มีรายการฝากของ","สร้างรายการฝากของชิ้นแรกของคุณได้เลย")}</div>` : ''}
    ${received.length ? section('inbox', 'ของที่ฝากถึงฉัน', received) : ''}
    ${sent.length ? section('send', 'ที่ฉันฝากไว้ (รอผู้รับ)', sent) : ''}
    ${done.length ? section('history', 'ประวัติ', done) : ''}
  `;
}

  return modalHead('package', 'สร้างรายการฝากของ', 'teal') + `
    <div class="field"><label for="depWhat">ฝากอะไร?</label><input id="depWhat" type="text" placeholder="เช่น กุญแจ, พัสดุ, กระเป๋า"></div>
    <div class="field"><label for="depFor">ฝากให้ใคร? (หมายเลขห้อง)</label><input id="depFor" type="text" placeholder="เช่น B-201"></div>
    ${dateTimeField('depEta', 'คาดว่าจะมารับเมื่อไหร่? (ไม่บังคับ)', { min: new Date() })}
    <div class="field"><label for="depNote">รายละเอียดเพิ่มเติม (ถ้ามี)</label><input id="depNote" type="text" placeholder="เช่น ฝากไว้ที่ป้อม รปภ."></div>

function depositDetailModal(d){
  const [label, tone] = DEPOSIT_STATUS[d.status] || DEPOSIT_STATUS.waiting;
  const sent = d.direction === 'sent';
  return modalHead('package', esc(d.item_name), sent ? 'teal' : 'sky') + `
    ${pill(label, tone)}
    <dl class="detail-list">
      <div><dt>${sent ? 'ฝากให้' : 'ผู้ฝาก'}</dt><dd>ห้อง ${esc(sent ? d.recipient_username : d.depositor_username)}</dd></div>
      ${d.note ? `<div><dt>รายละเอียด</dt><dd>${esc(d.note)}</dd></div>` : ''}
      ${d.eta ? `<div><dt>นัดรับ</dt><dd>${esc(d.eta)}</dd></div>` : ''}
      <div><dt>สร้างเมื่อ</dt><dd>${fmtDateTime(d.created_at)}</dd></div>
      ${d.collected_at ? `<div><dt>รับของเมื่อ</dt><dd>${fmtDateTime(d.collected_at)}</dd></div>` : ''}
    </dl>
    ${d.image_data ? `<img class="preview-img" style="margin:0 0 14px;" src="${esc(d.image_data)}" alt="">` : ''}
    ${d.status==='waiting' ? qrBlock(d.code, sent ? "ผู้รับต้องแสดงรหัสนี้ให้ตรงกันก่อนรับของ" : "แสดงรหัสนี้ตอนไปรับของ") : ''}
    ${d.status==='waiting' && sent && !d.recipient_registered ? infoBox('alert', 'ห้องนี้ยังไม่มีบัญชีในระบบ — เมื่อส่งของถึงมือแล้ว กดยืนยันเองได้เลย', 'amber') : ''}
    ${d.status==='waiting' ? `<button class="btn-primary" style="margin-top:14px;" data-do="collect-deposit" data-id="${d.id}">
        ${ico('check', 18, 2.2)}${sent ? 'ยืนยันว่าส่งถึงมือผู้รับแล้ว' : 'ยืนยันว่ารับของแล้ว'}</button>` : ''}
    ${d.status==='waiting' && sent && d.recipient_registered ? `<button class="btn-ghost" style="margin-top:10px;" data-do="open-scanner">${ico('scan', 18)}สแกน QR จากมือถือผู้รับ</button>` : ''}
    ${d.status==='waiting' && sent ? `<button class="btn-danger" style="margin-top:10px;" data-do="cancel-deposit" data-id="${d.id}">ยกเลิกรายการ</button>` : ''}

/* ---------- ของหายได้คืน ---------- */
function foundRow(f){
  let action = '';
  if(f.is_mine){
    action = pill('ของที่คุณแจ้งเจอ', 'sky')
      + (f.pending_claims ? pill(`มีคำขอรับ ${f.pending_claims} รายการ`, 'rose') : '');
  }else if(f.my_claim_status === 'pending'){
    action = `<div><button class="btn-secondary btn-inline" disabled>${ico('clock', 16)}รอผู้พบตรวจสอบคำขอ</button></div>`;
  }else{
    action = `<div><button class="btn-secondary btn-inline" data-claim="${f.id}">${ico('hand', 16)}นี่คือของฉัน${f.my_claim_status==='rejected' ? ' (ส่งคำขอใหม่)' : ''}</button></div>`;
  }
  return `<div class="list-row">
    ${thumb(f.image_data, iconFor(f.emoji, f.item_name, 'gift'), 'violet')}
    <div class="row-main">
      <div class="row-title">${esc(f.item_name)}</div>
      <div class="row-sub">${ico('pin', 13)} พบที่ ${esc(f.location)}${f.found_time ? ' · ' + esc(f.found_time) : ''}</div>
      <div class="row-meta">แจ้งโดยห้อง ${esc(f.finder_username)} · ${timeAgo(f.created_at)}</div>
      ${action}
    </div>
  </div>`;
}

/* ---------- โปรไฟล์ / แจ้งเตือน ---------- */
const BADGE_STYLE = {
  first_borrow:['repeat','sky'], regular_10:['star','violet'], on_time_5:['clock','teal'], on_time_20:['checkCircle','green'],
  handoff_5:['package','sky'], finder_1:['gift','amber'], finder_5:['search','violet'], points_100:['trophy','amber'],
};
function badgeCard(b){
  const [icon, tone] = BADGE_STYLE[b.code] || ['award', 'amber'];
  const pct = Math.round(b.progress / b.target * 100);
  return `<div class="badge ${b.earned ? 'earned' : 'locked'}" title="${esc(b.description)}">
    <div class="medal t-${b.earned ? tone : 'slate'}">${ico(b.earned ? icon : 'lock', 24, 1.8)}</div>
    <div class="badge-title">${esc(b.title)}</div>
    <div class="badge-desc">${esc(b.description)}</div>
    ${b.earned
      ? `<div class="badge-date">${ico('check', 12, 2.4)}ได้รับ ${parseDate(b.earned_at).toLocaleDateString('th-TH', {dateStyle:'medium'})}</div>`
      : `<div class="stock-bar t-${tone}" style="margin-top:8px;"><span style="width:${pct}%"></span></div>
         <div class="badge-date">${b.progress} / ${b.target}</div>`}
  </div>`;
}

    <div class="st-head">${tile(icon, tone, 32)}<div class="k">${label}</div></div>
    <div class="v">${value}${sub ? `<span class="v-sub">${sub}</span>` : ''}</div>
  </${nav ? 'button' : 'div'}>`;
}

function stockMeter(i){
  const pct = i.quantity ? Math.round(i.available_count / i.quantity * 100) : 0;
  const tone = i.status === 'repair' || i.status === 'retired' ? 'slate' : pct === 0 ? 'rose' : pct <= 34 ? 'amber' : 'green';
  return `<div class="stock">
    <div class="stock-bar t-${tone}"><span style="width:${i.status === 'available' || i.status === 'borrowed' ? pct : 0}%"></span></div>
    <div class="stock-text"><b>${i.available_count}</b> / ${i.quantity} ชิ้นว่าง</div>
  </div>`;
}

/* ===================== สแกน QR ===================== */
let scanStream = null, scanTimer = null;

function scannerModal(){
  const hint = user.isAdmin
    ? 'สแกน QR การยืม (BR-) ตอนรับของคืนที่ออฟฟิศ หรือ QR ฝากของ (DP-) ตอนส่งพัสดุให้ผู้รับ'
    : 'ให้ผู้รับเปิด QR รับของในแอป แล้วสแกนเพื่อยืนยันว่าส่งถึงมือแล้ว';
  return modalHead('scan', 'สแกน QR', 'teal') + `
    <p class="modal-text">${hint}</p>
    <div class="scan-box">
      <video id="scanVideo" playsinline muted></video>
      <div class="scan-frame"></div>
      <div id="scanStatus" class="scan-status">${ico('camera', 16)}กำลังเปิดกล้อง...</div>
    </div>
    <div class="field" style="margin-top:16px;"><label for="scanCode">สแกนไม่ได้? พิมพ์รหัสแทน</label>
      <input id="scanCode" type="text" autocomplete="off" placeholder="เช่น DP-1A2B3C" style="text-transform:uppercase; font-family:ui-monospace,Consolas,monospace; letter-spacing:1px;">
    </div>
    <button class="btn-primary" data-do="scan-submit">ยืนยันรหัส</button>`;
}

function setScanStatus(html, tone){
  const el = document.getElementById('scanStatus');
  if(el){ el.innerHTML = html; el.className = 'scan-status' + (tone ? ' ' + tone : ''); }
}

async function startScanner(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setScanStatus(`${ico('alert', 16)}เบราว์เซอร์นี้เปิดกล้องไม่ได้ — พิมพ์รหัสด้านล่างแทน`, 'err');
    return;
  }
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  }catch(e){
    // หมายเหตุ: กล้องใช้ได้เฉพาะ https หรือ localhost
    setScanStatus(`${ico('alert', 16)}เปิดกล้องไม่ได้ (ไม่ได้อนุญาต / ไม่มีกล้อง) — พิมพ์รหัสแทนได้`, 'err');
    return;
  }
  const video = document.getElementById('scanVideo');
  if(!video){ stopScanner(); return; }   // ผู้ใช้ปิดหน้าต่างไปก่อนกล้องเปิดเสร็จ
  video.srcObject = scanStream;
  await video.play().catch(()=>{});
  setScanStatus(`${ico('qr', 16)}เล็ง QR ให้อยู่ในกรอบ`);
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  scanTimer = setInterval(()=>{
    if(!scanStream || video.readyState < 2 || typeof jsQR === 'undefined') return;
    const scale = Math.min(1, 640 / video.videoWidth);   // ย่อภาพก่อนอ่าน ให้ลื่นบนมือถือ
    canvas.width = Math.round(video.videoWidth * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const hit = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if(hit && hit.data){
      stopScanner();
      if(navigator.vibrate) navigator.vibrate(80);
      setScanStatus(`${ico('check', 16)}อ่านได้: ${esc(hit.data)}`, 'ok');
      submitScan(hit.data, null);
    }
  }, 200);
}

function stopScanner(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

async function submitScan(code, btn){
  const run = async ()=>{
    const res = await api('/scan', { method:'POST', body:{ code: code.trim().toUpperCase() } });
    closeModal();
    showToast(res.message, '🎉');
    loadPage(state.page);
  };
  if(btn) return withBusy(btn, 'กำลังตรวจสอบ...', run);
  try{ await run(); }
  catch(err){
    setScanStatus(`${ico('alert', 16)}${esc(err.message)}`, 'err');
    showToast(err.message, '⚠️');
    const input = document.getElementById('scanCode');
    if(input) input.value = code;
  }
}

function render(){
  const content = document.getElementById('content');
  const nav = document.getElementById('bottomNav');
  document.getElementById('app-shell').classList.toggle('is-auth', state.page === "auth");
  if(state.page === "auth"){
    nav.style.display = "none";
    content.style.paddingBottom = "0";
    content.innerHTML = pageAuth();
  } else {
    nav.style.display = "flex";
    content.style.paddingBottom = "110px";
    const pages = {
      home: pageHome, borrow: pageBorrow, deposit: pageDeposit,
      lostfound: pageLostFound, profile: pageProfile, notifications: pageNotifications, admin: pageAdmin
    };
    content.innerHTML = pages[state.page] ? pages[state.page]() : pageHome();
    document.querySelectorAll('.nav-item').forEach(b=>{
      b.classList.toggle('active', b.dataset.nav === state.page);
    });
    document.getElementById('navAdmin').style.display = user.isAdmin ? '' : 'none';
  }
}

/* ===================== EVENTS (delegated) ===================== */
document.body.addEventListener('click', async (e)=>{
  const t = e.target.closest('[data-nav], [data-back], [data-authmode], [data-do], [data-cat], [data-item], [data-close], [data-lftab], [data-dur], [data-upload], [data-deposit], [data-return], [data-claim], [data-admintab], [data-afilter], [data-pick]');
  if(!t || t.disabled) return;

  if(t.dataset.nav){ goto(t.dataset.nav); return; }
  if(t.dataset.back !== undefined){ goto('home'); return; }
  if(t.dataset.authmode){ state.authMode = t.dataset.authmode; state.authError = null; render(); return; }
  if(t.dataset.cat){ state.filterCat = t.dataset.cat; render(); return; }
  if(t.dataset.lftab){ state.lfTab = t.dataset.lftab; render(); return; }
  if(t.dataset.admintab){
    state.adminTab = t.dataset.admintab;
    if(t.dataset.admintab === 'borrows') adminData.borrows = null;
    if(state.page !== 'admin') goto('admin'); else { render(); loadPage('admin'); }
    return;
  }
  if(t.dataset.afilter){
    const [kind, value] = t.dataset.afilter.split(':');
    if(kind === 'borrow'){ state.adminBorrowFilter = value; adminData.borrows = null; }
    if(kind === 'deposit'){ state.adminDepositFilter = value; adminData.deposits = null; }
    render(); loadPage('admin');
    return;
  }
  if(t.dataset.pick){
    const box = document.getElementById('itIcon');
    box.dataset.value = t.dataset.pick;
    box.querySelectorAll('.icon-opt').forEach(b => b.classList.toggle('active', b === t));
    return;
  }
  if(t.dataset.close !== undefined){ closeModal(); return; }
  if(t.dataset.dur){
    document.querySelectorAll('.duration-opt').forEach(d=>d.classList.remove('active'));
    t.classList.add('active');
    return;
  }
  if(t.dataset.upload){ document.getElementById('fileInput_' + t.dataset.upload).click(); return; }
  if(t.dataset.deposit){
    const d = depositsData.find(x=>x.id==t.dataset.deposit);
    if(d) openModal(depositDetailModal(d));
    return;
  }
  if(t.dataset.claim){
    const f = foundData.find(x=>x.id==t.dataset.claim);
    if(f) openModal(claimModal(f));
    return;
  }
  if(t.dataset.item){
    const it = items.find(x=>x.id==t.dataset.item);
    if(it) openModal(itemModal(it));
    return;
  }
  if(t.dataset.return){
    const rec = myBorrows.find(b=>b.id==t.dataset.return);
    if(rec) openModal(returnModal(rec));
    return;
  }

  const id = t.dataset.id;
  switch(t.dataset.do){
    /* ---------- เข้าสู่ระบบ / สมัคร / ออก ---------- */
    case 'login': {
      const username = val('authUsername');
      const password = document.getElementById('authPassword').value;
      state.authUsername = username;
      if(!username || !password){ state.authError = 'กรอกหมายเลขห้องพักและรหัสผ่านให้ครบ'; render(); break; }
      state.authError = null; state.authLoading = true; render();
      try{
        const res = await api('/login', { method:'POST', form:{ username, password }, auth:false });
        authToken = res.access_token;
        localStorage.setItem('dsc_token', authToken);
        state.authLoading = false;
        await completeLogin();
        showToast('เข้าสู่ระบบสำเร็จ ยินดีต้อนรับกลับมา!', '👋');
      }catch(err){
        state.authLoading = false; state.authError = err.message; render();
      }
      break;
    }
    case 'register': {
      const username = val('authUsername');
      const fullName = val('authFullName');
      const email = val('authEmail');
      const password = document.getElementById('authPassword').value;
      Object.assign(state, { authUsername: username, authFullName: fullName, authEmail: email });
      if(!username || !password){ state.authError = 'กรอกหมายเลขห้องพักและรหัสผ่านให้ครบ'; render(); break; }
      state.authError = null; state.authLoading = true; render();
      try{
        await api('/register', { method:'POST', auth:false,
          body:{ username, password, email: email || null, full_name: fullName || null } });
        const res = await api('/login', { method:'POST', form:{ username, password }, auth:false });
        authToken = res.access_token;
        localStorage.setItem('dsc_token', authToken);
        state.authLoading = false;
        await completeLogin();
        showToast('สมัครสมาชิกสำเร็จ ยินดีต้อนรับ!', '🎉');
      }catch(err){
        state.authLoading = false; state.authError = err.message; render();
      }
      break;
    }
    case 'logout':
      api('/logout', { method:'POST' }).catch(()=>{});
      authToken = null;
      localStorage.removeItem('dsc_token');
      resetAppData();
      state.page = 'auth'; state.authMode = 'login'; state.authError = null;
      render();
      break;

    /* ---------- ยืม-คืน ---------- */
    case 'confirm-borrow': {
      const durEl = document.querySelector('.duration-opt.active');
      const dur = durEl ? durEl.dataset.dur : DURATIONS[0];
      await withBusy(t, 'กำลังส่งคำขอ...', async ()=>{
        const record = await api(`/items/${t.dataset.itemId}/borrow`, { method:'POST', body:{ duration_label: dur } });
        openModal(borrowSuccessModal(record));
        loadPage('borrow');
      });
      break;
    }
    case 'confirm-return':
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        const res = await api(`/borrow/${t.dataset.record}/return`, { method:'POST',
          body:{ image_data: uploads.return || null, note: val('returnNote') || null } });
        closeModal();
        showToast(res.points_awarded > 0
          ? `คืนของสำเร็จ! ได้รับ +${res.points_awarded} แต้ม`
          : 'แจ้งคืนของสำเร็จ ขอบคุณที่ดูแลของส่วนกลาง!', res.points_awarded > 0 ? '🎉' : '✅');
        loadPage('borrow');
      });
      break;

    /* ---------- ฝากของ ---------- */
    case 'new-deposit': openModal(newDepositModal()); break;
    case 'confirm-deposit': {
      const item_name = val('depWhat'), recipient_username = val('depFor');
      if(!item_name || !recipient_username){ showToast('กรอก "ฝากอะไร" และ "ฝากให้ห้องไหน" ให้ครบ', '⚠️'); break; }
      await withBusy(t, 'กำลังสร้างรายการ...', async ()=>{
        const d = await api('/deposits', { method:'POST', body:{
          item_name, recipient_username, eta: pickedDateTime('depEta') || null, note: val('depNote') || null,
          image_data: uploads.deposit || null } });
        openModal(depositSuccessModal(d));
        loadPage('deposit');
      });
      break;
    }
    case 'collect-deposit':
      await withBusy(t, 'กำลังยืนยัน...', async ()=>{
        const d = await api(`/deposits/${id}/collect`, { method:'POST' });
        closeModal();
        showToast(d.direction === 'sent'
          ? `ส่งของถึงมือแล้ว! ได้รับ +${POINT_RULES.depositHandedOff} แต้ม`
          : 'ยืนยันรับของเรียบร้อย', d.direction === 'sent' ? '🎉' : '📥');
        loadPage('deposit');
      });
      break;
    case 'cancel-deposit':
      if(!confirm('ยกเลิกรายการฝากนี้ใช่ไหม?')) break;
      await withBusy(t, 'กำลังยกเลิก...', async ()=>{
        await api(`/deposits/${id}/cancel`, { method:'POST' });
        closeModal(); showToast('ยกเลิกรายการฝากแล้ว', '🚫');
        loadPage('deposit');
      });
      break;

    /* ---------- ของหายได้คืน ---------- */
    case 'new-found': openModal(newFoundModal()); break;
    case 'confirm-found': {
      const item_name = val('foundWhat'), location = val('foundWhere');
      if(!item_name || !location){ showToast('กรอก "เจออะไร" และ "เจอที่ไหน" ให้ครบ', '⚠️'); break; }
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        await api('/found', { method:'POST', body:{
          item_name, location, found_time: pickedDateTime('foundWhen') || null,
          emoji: guessEmoji(item_name, '🎁'), image_data: uploads.found || null } });
        closeModal();
        showToast('แจ้งเจอของเรียบร้อย ขอบคุณสำหรับความดีของคุณ!', '🎉');
        state.lfTab = 'found'; loadPage('lostfound');
      });
      break;
    }
    case 'new-lost': openModal(newLostModal()); break;
    case 'confirm-lost': {
      const item_name = val('lostWhat'), where = val('lostWhere'), when = pickedDateTime('lostWhen');
      if(!item_name || !where){ showToast('กรอกชื่อของและสถานที่ที่หายให้ครบ', '⚠️'); break; }
      const location_time = when ? `${where} · ${when}` : where;
      await withBusy(t, 'กำลังประกาศ...', async ()=>{
        await api('/lost', { method:'POST', body:{
          item_name, location_time, emoji: guessEmoji(item_name, '🔍'), image_data: uploads.lost || null } });
        closeModal();
        showToast('ประกาศตามหาของเรียบร้อยแล้ว', '📢');
        state.lfTab = 'lost'; loadPage('lostfound');
      });
      break;
    }
    case 'confirm-claim': {
      const detail = val('claimDetail');
      if(detail.length < 5){ showToast('อธิบายลักษณะของอย่างน้อย 5 ตัวอักษร', '⚠️'); break; }
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        await api(`/found/${id}/claims`, { method:'POST', body:{ detail } });
        closeModal();
        showToast('ส่งคำขอแล้ว รอผู้พบตรวจสอบ', '✋');
        loadPage('lostfound');
      });
      break;
    }
    case 'approve-claim':
      if(!confirm(`ยืนยันว่าห้อง ${t.dataset.who} เป็นเจ้าของจริง และจะคืนของให้?`)) break;
      await withBusy(t, '...', async ()=>{
        await api(`/claims/${id}/approve`, { method:'POST' });
        showToast(`คืนของให้เจ้าของแล้ว! ได้รับ +${POINT_RULES.foundReturned} แต้ม`, '🎉');
        loadPage('lostfound');
      });
      break;
    case 'reject-claim':
      await withBusy(t, '...', async ()=>{
        await api(`/claims/${id}/reject`, { method:'POST' });
        showToast('ปฏิเสธคำขอแล้ว', '❌');
        loadPage('lostfound');
      });
      break;
    /* ---------- คิวรอของว่าง ---------- */
    case 'join-waitlist':
      await withBusy(t, 'กำลังเข้าคิว...', async ()=>{
        const res = await api(`/items/${id}/waitlist`, { method:'POST' });
        closeModal();
        showToast(`เข้าคิวแล้ว — คุณอยู่คิวที่ ${res.position} ระบบจะแจ้งเตือนเมื่อว่าง`, '🔔');
        loadPage('borrow');
      });
      break;
    case 'leave-waitlist':
      await withBusy(t, '...', async ()=>{
        await api(`/items/${id}/waitlist`, { method:'DELETE' });
        closeModal(); showToast('ออกจากคิวแล้ว');
        loadPage('borrow');
      });
      break;

    /* ---------- สแกน QR ---------- */
    case 'open-scanner': openModal(scannerModal()); startScanner(); break;
    case 'scan-submit': {
      const code = val('scanCode');
      if(code.length < 4){ showToast('พิมพ์รหัสให้ครบ เช่น DP-1A2B3C', '⚠️'); break; }
      stopScanner();
      await submitScan(code, t);
      break;
    }

    /* ---------- นิติบุคคล ---------- */
    case 'admin-new-item': openModal(itemFormModal(null)); break;
    case 'admin-edit-item': {
      const it = (adminData.items || []).find(x => x.id == id);
      if(it) openModal(itemFormModal(it));
      break;
    }
    case 'admin-save-item': {
      const name = val('itName');
      const quantity = parseInt(val('itQty'), 10);
      if(!name){ showToast('กรอกชื่อสิ่งของ', '⚠️'); break; }
      if(!(quantity >= 1 && quantity <= 999)){ showToast('จำนวนต้องอยู่ระหว่าง 1–999 ชิ้น', '⚠️'); break; }
      const body = { name, quantity, category: val('itCat'), emoji: document.getElementById('itIcon').dataset.value || '📦' };
      const statusEl = document.getElementById('itStatus');
      if(statusEl) body.status = statusEl.value;
      await withBusy(t, 'กำลังบันทึก...', async ()=>{
        await api(id ? `/admin/items/${id}` : '/admin/items', { method: id ? 'PUT' : 'POST', body });
        closeModal();
        showToast(id ? 'บันทึกการแก้ไขแล้ว' : `เพิ่ม ${name} แล้ว`);
        state.adminTab = 'items';
        if(state.page !== 'admin') goto('admin'); else { render(); loadPage('admin'); }
      });
      break;
    }
    case 'admin-delete-item':
      if(!confirm(`ลบ "${t.dataset.name}" ออกจากระบบ?`)) break;
      await withBusy(t, 'กำลังลบ...', async ()=>{
        await api(`/admin/items/${id}`, { method:'DELETE' });
        closeModal(); showToast('ลบรายการแล้ว');
        loadPage('admin');
      });
      break;
    case 'admin-return':
      if(!confirm(`บันทึกว่าได้รับ "${t.dataset.name}" คืนจากห้อง ${t.dataset.who} แล้ว?`)) break;
      await withBusy(t, 'กำลังบันทึก...', async ()=>{
        await api(`/admin/borrows/${id}/return`, { method:'POST' });
        showToast('บันทึกรับคืนแล้ว');
        loadPage('admin');
      });
      break;
    case 'admin-toggle-user': {
      const enable = t.dataset.active === '1';
      if(!confirm(`${enable ? 'เปิด' : 'ปิด'}ใช้งานบัญชีห้อง ${t.dataset.name}?`)) break;
      await withBusy(t, '...', async ()=>{
        const res = await api(`/admin/users/${id}/active`, { method:'POST', body:{ is_active: enable } });
        showToast(res.message);
        loadPage('admin');
      });
      break;
    }
    case 'admin-announce': openModal(announceModal()); break;
    case 'admin-send-announce': {
      const title = val('anTitle');
      if(!title){ showToast('กรอกหัวข้อประกาศ', '⚠️'); break; }
      await withBusy(t, 'กำลังส่ง...', async ()=>{
        const res = await api('/admin/announcements', { method:'POST', body:{ title, body: val('anBody') || null } });
        closeModal();
        showToast(`ส่งประกาศถึง ${res.sent} ห้องแล้ว`);
      });
      break;
    }

    case 'resolve-lost':
      await withBusy(t, 'กำลังปิดประกาศ...', async ()=>{
        await api(`/lost/${id}/resolve`, { method:'POST' });
        showToast('ดีใจด้วยที่เจอของแล้ว!', '😊');
        loadPage('lostfound');
      });
      break;
  }
});

/* รูปที่ผู้ใช้เลือก: ย่อขนาด → เก็บไว้ใน uploads[key] → แสดงตัวอย่าง (ส่งขึ้น server ตอนกดยืนยัน) */
document.body.addEventListener('change', async (e)=>{
  if(e.target.type !== 'file' || !e.target.files[0]) return;
  const key = e.target.id.replace('fileInput_', '');
  const box = e.target.closest('.upload-box');
  try{
    const dataUrl = await compressImage(e.target.files[0]);
    uploads[key] = dataUrl;
    let img = box.querySelector('.preview-img');
    if(!img){ img = document.createElement('img'); img.className = 'preview-img'; box.appendChild(img); }
    img.src = dataUrl;
    const txt = box.querySelector('.up-text'); if(txt) txt.textContent = 'แตะเพื่อเปลี่ยนรูป';
  }catch(err){
    showToast(err.message, '⚠️');
  }
});

/* ค้นหาของส่วนกลาง: กรองการ์ดในหน้าทันทีโดยไม่ re-render (ช่องค้นหาจะได้ไม่หลุดโฟกัส) */
document.body.addEventListener('input', (e)=>{
  if(e.target.id === 'adminUserSearch'){
    const q = e.target.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('.user-row').forEach(r => {
      const match = !q || r.dataset.q.includes(q);
      r.style.display = match ? '' : 'none';
      if(match) shown++;
    });
    document.getElementById('userSearchEmpty').style.display = (q && shown===0) ? '' : 'none';
    return;
  }
  if(e.target.id !== 'searchInput') return;
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  document.querySelectorAll('.item-card').forEach(card=>{
    const match = !q || card.dataset.name.includes(q);
    card.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  const empty = document.getElementById('searchEmpty');
  if(empty) empty.style.display = (q && shown===0) ? '' : 'none';
});

/* กด Enter ในหน้าเข้าสู่ระบบ = กดปุ่ม */
document.body.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && e.target.id === 'scanCode'){
    const btn = document.querySelector('[data-do="scan-submit"]');
    if(btn && !btn.disabled) btn.click();
    return;
  }
  if(e.key === 'Enter' && state.page === 'auth' && e.target.tagName === 'INPUT'){
    const btn = document.querySelector('.auth-wrap .btn-primary');
    if(btn && !btn.disabled) btn.click();
  }
});

document.body.addEventListener('click', (e)=>{
  const input = e.target.closest('.dt-wrap')?.querySelector('.dt-input');
  if(input && typeof input.showPicker === 'function'){ try{ input.showPicker(); }catch(_){ /* เบราว์เซอร์เก่าใช้ปุ่มของตัวเองแทน */ } }
});

document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

/* trigger a little coin bounce whenever home page is shown */
function bouncePoints(){
  const card = document.getElementById('pointsCard');
  if(card){ card.classList.add('bounce'); setTimeout(()=>card.classList.remove('bounce'), 700); }
}
const _origGoto = goto;
goto = function(page){ _origGoto(page); if(page==='home') setTimeout(bouncePoints, 80); };

/* เช็กแจ้งเตือนใหม่ทุก 30 วินาที (อัปเดตจุดแดงที่กระดิ่ง + แต้ม) */
setInterval(async ()=>{
  if(!authToken || state.page === 'auth' || document.hidden) return;
  try{
    applySummary(await api('/summary/me'));
    updateBell();
    if(state.page === 'home' && !document.getElementById('modalOverlay').classList.contains('open')) render();
  }catch(e){ /* เงียบไว้ ไม่รบกวนผู้ใช้ */ }
}, 30000);

/* ===================== INIT: restore session if we have a token ===================== */
(async function initSession(){
  if(!authToken){ render(); return; }
  try{
    await completeLogin();
  }catch(err){
    if(state.page !== 'auth'){ state.page = 'auth'; }
    state.authError = err.message;
    render();
  }
})();
</script>
